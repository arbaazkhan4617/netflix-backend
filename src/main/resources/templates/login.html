<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netflix Backend Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141E30, #243B55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .login-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 350px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 20px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: white;
            color: black;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .google-btn:hover {
            background: #f1f1f1;
        }

        img {
            width: 20px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h2>Welcome</h2>
    <p>Login using Google</p>

    <a class="google-btn" href="/netflix-backend/oauth2/authorization/google">
        <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" />
        Continue with Google
    </a>
</div>

</body>
</html>
